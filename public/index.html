       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated

  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).

  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();

<body class="min-h-screen bg-ground text-fg">

  <script>
  (function () {
    'use strict';
    var params = new URLSearchParams(location.search);
    var TOKEN = params.get('token') || '';
    var DEMO = params.get('demo') === '1';
    var API_QS = DEMO ? '?demo=1' : '';
    var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    // The Hyrox race: Running, then the eight stations in race order — the
    // same fixed list server.js serves, so the Station select is filled
    // while loading and when loading fails.
    var STATIONS = [
      { ref: 's:running', name: 'Running', order: 0, weighted: false },
      { ref: 's:ski-erg', name: 'SkiErg', order: 1, weighted: false },
      { ref: 's:sled-push', name: 'Sled push', order: 2, weighted: true },
      { ref: 's:sled-pull', name: 'Sled pull', order: 3, weighted: true },
      { ref: 's:burpee-broad-jumps', name: 'Burpee broad jumps', order: 4, weighted: false },
      { ref: 's:rowing', name: 'Rowing', order: 5, weighted: false },
      { ref: 's:farmers-carry', name: 'Farmers carry', order: 6, weighted: true },
      { ref: 's:sandbag-lunges', name: 'Sandbag lunges', order: 7, weighted: true },
      { ref: 's:wall-balls', name: 'Wall balls', order: 8, weighted: true },
    ];

    var stations = STATIONS;
    var sets = [];
    var selectedRef = null;   // the log form's station
    var progressRef = null;   // the Progress section's station
    var confirmDeleteId = null;
    var saving = false;

    function $(id) { return document.getElementById(id); }
    function show(e) { e.hidden = false; }
    function hide(e) { e.hidden = true; }
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    // "Now" as the platform hands it to the page; weeks, day groups and
    // "New best" are all worked out from it, in the viewer's local time.
    function nowDate() {
      try {
        if (window.usernode && typeof window.usernode.now === 'function') {
          var d = window.usernode.now();
          if (d instanceof Date && !isNaN(d)) return d;
        }
      } catch (e) {}
      return new Date();
    }

    function api(method, path, body) {
      var opts = { method: method, headers: { 'Content-Type': 'application/json', 'x-usernode-token': TOKEN } };
      if (body) opts.body = JSON.stringify(body);
      return fetch('/api/' + path + API_QS, opts).then(function (res) {
        return res.text().then(function (text) {
          var data = {};
          try { data = text ? JSON.parse(text) : {}; } catch (e) {}
          return { ok: res.ok, status: res.status, data: data };
        });
      });
    }

    // ── Formatting ────────────────────────────────────────────────────────
    function fmtWeight(n) { return String(Math.round(parseFloat(n) * 100) / 100); }
    function fmtTime(sec) {
      sec = Math.round(sec);
      var m = Math.floor(sec / 60), r = sec % 60;
      return m + ':' + (r < 10 ? '0' : '') + r;
    }
    function fmtSet(s) {
      var w = s.weight_kg != null ? parseFloat(s.weight_kg) : null;
      if (w != null && w > 0) return fmtWeight(w) + ' kg' + (s.reps != null ? ' × ' + s.reps : '');
      if (s.reps != null) return 'Body × ' + s.reps;
      if (s.seconds != null) return fmtTime(s.seconds);
      return '—';
    }
    function fmtDate(d) {
      var out = d.getDate() + ' ' + MONTHS[d.getMonth()];
      if (d.getFullYear() !== nowDate().getFullYear()) out += ' ' + d.getFullYear();
      return out;
    }
    function weekStart(d) {
      var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // weeks start Monday
      return x;
    }
    function sameLocalDay(iso, ref) {
      var d = new Date(iso);
      return d.getFullYear() === ref.getFullYear() && d.getMonth() === ref.getMonth() && d.getDate() === ref.getDate();
    }

    // A best set: heaviest weight, more reps winning a tie; without weight,
    // the most reps; then the shorter time — for timed work, faster is
    // better, and a set with a time beats one without when the rest ties.
    function beats(a, b) {
      var aw = a.weight_kg != null && parseFloat(a.weight_kg) > 0;
      var bw = b.weight_kg != null && parseFloat(b.weight_kg) > 0;
      if (aw && bw && parseFloat(a.weight_kg) !== parseFloat(b.weight_kg)) {
        return parseFloat(a.weight_kg) > parseFloat(b.weight_kg);
      }
      if (aw !== bw) return aw;
      if ((a.reps || 0) !== (b.reps || 0)) return (a.reps || 0) > (b.reps || 0);
      var at = a.seconds != null && a.seconds > 0;
      var bt = b.seconds != null && b.seconds > 0;
      if (at !== bt) return at;
      if (at && a.seconds !== b.seconds) return a.seconds < b.seconds;
      return false;
    }

    function setsFor(ref) {
      return sets.filter(function (s) { return s.exercise_ref === ref; });
    }
    function bestOf(list) {
      var best = null;
      for (var i = 0; i < list.length; i++) if (!best || beats(list[i], best)) best = list[i];
      return best;
    }

    // ── Loading, empty and error states ──────────────────────────────────
    function showLoading() {
      hide($('load-error'));
      show($('progress-sec')); show($('history-sec'));
      show($('progress-loading')); hide($('progress-body')); hide($('progress-empty'));
      show($('history-label'));
      show($('history-loading')); hide($('history'));
    }
    function showError() {
      hide($('progress-sec')); hide($('history-sec'));
      show($('load-error'));
    }

    // ── Stations ─────────────────────────────────────────────────────────
    var ICON_BIN_SM = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';

    function stationByRef(ref) {
      for (var i = 0; i < stations.length; i++) if (stations[i].ref === ref) return stations[i];
      return null;
    }
    function exerciseName(ref) {
      var s = stationByRef(ref);
      return s ? s.name : 'Exercise';
    }
    // Numbered in the picker and the chips (Running is the run, not a
    // station); unnumbered in History.
    function stationLabel(s) { return s.order ? s.order + ' ' + s.name : s.name; }

    function renderExerciseSelect() {
      if (!selectedRef || !stationByRef(selectedRef)) {
        selectedRef = stations.length ? stations[0].ref : null; // Running first
      }
      var sel = $('exercise-select');
      sel.innerHTML = '';
      stations.forEach(function (s) {
        var o = el('option', '', stationLabel(s));
        o.value = s.ref;
        sel.appendChild(o);
      });
      if (selectedRef) sel.value = selectedRef;
    }

    function prefillFromLast(ref) {
      var last = null;
      for (var i = 0; i < sets.length; i++) {
        if (sets[i].exercise_ref === ref) { last = sets[i]; break; } // sets are newest first
      }
      var w = last && last.weight_kg != null ? parseFloat(last.weight_kg) : null;
      $('weight-input').value = w != null && w > 0 ? fmtWeight(w) : '';
      $('reps-input').value = last && last.reps != null ? String(last.reps) : '';
      $('time-input').value = last && last.seconds != null && last.seconds > 0 ? fmtTime(last.seconds) : '';
    }

    // ── Progress ─────────────────────────────────────────────────────────
    function loggedRefs() {
      var last = {};
      sets.forEach(function (s) {
        var prev = last[s.exercise_ref];
        if (!prev || s.logged_at > prev) last[s.exercise_ref] = s.logged_at;
      });
      return Object.keys(last).sort(function (a, b) { return last[a] < last[b] ? 1 : last[a] > last[b] ? -1 : 0; });
    }

    function renderProgress() {
      var refs = loggedRefs();
      if (!refs.length) {
        hide($('progress-body'));
        show($('progress-empty'));
        return;
      }
      hide($('progress-empty'));
      // The station opened first is the one logged most recently; chips
      // list every station either way, so an unlogged one stays open.
      if (!progressRef || !stationByRef(progressRef)) progressRef = refs[0];
      renderChips();
      renderCard();
      show($('progress-body'));
    }

    function renderChips() {
      var host = $('chips');
      host.innerHTML = '';
      stations.forEach(function (s) {
        var c = el('button', s.ref === progressRef ? 'chip on' : 'chip', stationLabel(s));
        c.type = 'button';
        c.setAttribute('data-ref', s.ref);
        host.appendChild(c);
      });
    }

    // Plate widths and heights, from the drawn barbell.
    var PLATE_SIZES = { '25': [9, 32], '20': [8, 30], '15': [7, 26], '10': [6, 20], '5': [4, 14], '2.5': [3, 10], '1.25': [2, 8] };
    var PLATE_ORDER = [25, 20, 15, 10, 5, 2.5, 1.25];

    function renderCard() {
      var st = stationByRef(progressRef);
      var list = setsFor(progressRef);
      if (!list.length) {
        // A station with no sets: the card says so, the weeks list hides.
        hide($('card-main'));
        $('station-empty-text').textContent =
          'No sets of ' + (st ? st.name : 'this station') + ' yet. Log one above.';
        show($('station-empty'));
        hide($('weeks-label'));
        hide($('weeks'));
        return;
      }
      show($('card-main'));
      hide($('station-empty'));
      show($('weeks-label'));
      show($('weeks'));
      var best = bestOf(list);
      var w = best.weight_kg != null ? parseFloat(best.weight_kg) : null;
      $('best-line').textContent = fmtSet(best);
      // Inside a sentence the relative day is lowercase; weekdays and dates
      // stay as the History groups spell them.
      var day = dayLabel(new Date(best.logged_at), nowDate());
      if (day === 'Today') day = 'today';
      if (day === 'Yesterday') day = 'yesterday';
      $('best-sub').textContent = 'Best set ever, logged ' + day;
      var isNew = sameLocalDay(best.logged_at, nowDate());
      if (isNew) show($('best-badge')); else hide($('best-badge'));
      // The loaded barbell — the best weight as real plates on a 20 kg
      // bar — is drawn for the weighted stations only.
      var holder = $('plates');
      holder.innerHTML = '';
      if (st && st.weighted) {
        show($('bar-wrap'));
        var note;
        if (w == null || w <= 0) {
          note = 'Bodyweight: the empty bar';
        } else if (w < 20) {
          note = 'Under 20 kg: the empty bar';
        } else {
          var perSide = (w - 20) / 2, left = perSide, parts = [];
          PLATE_ORDER.forEach(function (p) {
            while (left >= p - 1e-9) {
              left = Math.round((left - p) * 100) / 100;
              parts.push(p);
              var d = el('div', p === 25 ? 'p o' : 'p');
              d.style.width = PLATE_SIZES[String(p)][0] + 'px';
              d.style.height = PLATE_SIZES[String(p)][1] + 'px';
              holder.appendChild(d);
            }
          });
          if (parts.length) {
            note = 'On the bar: ' + parts.join(' + ') + ' kg a side' +
              (left > 0 ? ' plus ' + fmtWeight(left) + ' kg' : '') + ', 20 kg bar';
          } else {
            note = 'On the bar: the bare 20 kg bar';
          }
        }
        $('bar-note').textContent = note;
      } else {
        hide($('bar-wrap'));
      }
      renderWeeks();
    }

    function compareText(best, prevBest) {
      if (!prevBest) return { cls: 'small', text: 'First week' };
      var bw = best.weight_kg != null && parseFloat(best.weight_kg) > 0;
      var pw = prevBest.weight_kg != null && parseFloat(prevBest.weight_kg) > 0;
      if (bw && pw) {
        var d = parseFloat(best.weight_kg) - parseFloat(prevBest.weight_kg);
        if (d > 0) return { cls: 'pr', text: 'Up ' + fmtWeight(d) + ' kg' };
        if (d < 0) return { cls: 'small', text: 'Down ' + fmtWeight(-d) + ' kg' };
      }
      if ((best.reps || 0) !== (prevBest.reps || 0)) {
        var rd = (best.reps || 0) - (prevBest.reps || 0);
        return rd > 0
          ? { cls: 'pr', text: 'Up ' + rd + (rd === 1 ? ' rep' : ' reps') }
          : { cls: 'small', text: 'Down ' + (-rd) + (rd === -1 ? ' rep' : ' reps') };
      }
      if (best.reps == null && prevBest.reps == null && best.seconds != null && prevBest.seconds != null && best.seconds !== prevBest.seconds) {
        // Timed work: shorter is better, so a falling time is the win.
        var sd = best.seconds - prevBest.seconds;
        return sd < 0
          ? { cls: 'pr', text: 'Faster by ' + fmtTime(-sd) }
          : { cls: 'small', text: 'Slower by ' + fmtTime(sd) };
      }
      return { cls: 'small', text: 'Same as before' };
    }

    function renderWeeks() {
      var byWeek = {};
      setsFor(progressRef).forEach(function (s) {
        var wk = weekStart(new Date(s.logged_at)).getTime();
        var g = byWeek[wk] || (byWeek[wk] = { best: null, count: 0 });
        g.count += 1;
        if (!g.best || beats(s, g.best)) g.best = s;
      });
      var wks = Object.keys(byWeek).map(Number).sort(function (a, b) { return b - a; });
      var host = $('weeks');
      host.innerHTML = '';
      var thisWeek = weekStart(nowDate()).getTime();
      wks.forEach(function (wk, i) {
        var g = byWeek[wk];
        var row = el('div', 'list-row wk');
        var grow = el('div', 'grow');
        if (wk === thisWeek) {
          grow.appendChild(el('div', 'b', 'This week'));
          grow.appendChild(el('div', 'small', 'From ' + fmtDate(new Date(wk))));
        } else {
          grow.appendChild(el('div', 'b', 'Week of ' + fmtDate(new Date(wk))));
          grow.appendChild(el('div', 'small', g.count + (g.count === 1 ? ' set' : ' sets')));
        }
        var r = el('div', 'r');
        r.appendChild(el('div', 'b', fmtSet(g.best)));
        var cmp = compareText(g.best, i < wks.length - 1 ? byWeek[wks[i + 1]].best : null);
        r.appendChild(el('div', cmp.cls, cmp.text));
        row.appendChild(grow);
        row.appendChild(r);
        host.appendChild(row);
      });
    }

    // ── History ──────────────────────────────────────────────────────────
    function dayLabel(date, refNow) {
      var todayMid = new Date(refNow.getFullYear(), refNow.getMonth(), refNow.getDate());
      var diff = Math.round((todayMid - new Date(date.getFullYear(), date.getMonth(), date.getDate())) / 86400000);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Yesterday';
      if (diff < 7) return WEEKDAYS[date.getDay()];
      return fmtDate(date);
    }

    function renderHistory() {
      var host = $('history');
      host.innerHTML = '';
      if (!sets.length) {
        // The message is shown once, in the Progress card; the History
        // section stays empty until the first set is logged.
        hide(host);
        hide($('history-label'));
        return;
      }
      show($('history-label'));
      show(host);

      // Group by local day, newest day first; sets arrive newest first.
      var groups = [];
      var cur = null, curKey = null;
      sets.forEach(function (s) {
        var d = new Date(s.logged_at);
        var key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        if (key !== curKey) {
          curKey = key;
          cur = { label: '', date: d, sets: [] };
          groups.push(cur);
        }
        cur.sets.push(s);
      });
      var refNow = nowDate();
      groups.forEach(function (g) {
        g.label = dayLabel(g.date, refNow);
        // Set number that day for that exercise, counting chronologically.
        var n = {};
        for (var i = g.sets.length - 1; i >= 0; i--) {
          var s = g.sets[i];
          n[s.exercise_ref] = (n[s.exercise_ref] || 0) + 1;
          s._num = n[s.exercise_ref];
        }
      });
      // "New best": the set beat every earlier set of that exercise.
      var bestSoFar = {};
      var isNewBest = {};
      for (var i = sets.length - 1; i >= 0; i--) { // oldest first
        var s = sets[i];
        var prev = bestSoFar[s.exercise_ref];
        isNewBest[s.id] = !prev || beats(s, prev);
        if (!prev || beats(s, prev)) bestSoFar[s.exercise_ref] = s;
      }

      groups.forEach(function (g) {
        host.appendChild(el('div', 'day', g.label));
        g.sets.forEach(function (s) {
          var row = el('div', 'list-row');
          var grow = el('div', 'grow');
          grow.appendChild(el('div', 'b', exerciseName(s.exercise_ref)));
          grow.appendChild(el('div', 'small', 'Set ' + s._num + (s.seconds != null ? ', ' + fmtTime(s.seconds) : '')));
          row.appendChild(grow);
          if (String(s.id) === String(confirmDeleteId)) {
            row.appendChild(el('span', 'small del-q', 'Delete this set?'));
            var yes = el('button', 'del-yes', 'Delete');
            yes.type = 'button';
            yes.setAttribute('data-id', s.id);
            var no = el('button', 'del-no', 'Keep');
            no.type = 'button';
            row.appendChild(yes);
            row.appendChild(no);
          } else {
            var r = el('div', 'r');
            r.appendChild(el('div', 'b', fmtSet(s)));
            if (isNewBest[s.id]) r.appendChild(el('div', 'pr', 'New best'));
            row.appendChild(r);
            var bin = el('button', 'ico');
            bin.type = 'button';
            bin.setAttribute('aria-label', 'Delete set');
            bin.setAttribute('data-id', s.id);
            bin.innerHTML = ICON_BIN_SM;
            row.appendChild(bin);
          }
          host.appendChild(row);
        });
      });
    }

    function renderAll() {
      renderExerciseSelect();
      renderProgress();
      renderHistory();
    }

    // ── Actions ──────────────────────────────────────────────────────────
    function showSaveError(msg) {
      var p = $('save-error');
      p.textContent = msg;
      show(p);
    }

    function parseWeight(v) {
      var t = String(v).trim().replace(',', '.');
      if (!t) return { value: null };
      var n = Number(t);
      if (!isFinite(n)) return { error: 'Enter weight in kilograms, like 102.5.' };
      return { value: n };
    }
    function parseReps(v) {
      var t = String(v).trim();
      if (!t) return { value: null };
      var n = Number(t);
      if (!isFinite(n) || Math.round(n) !== n) return { error: 'Enter reps as a whole number.' };
      return { value: n };
    }
    function parseTime(v) {
      var t = String(v).trim();
      if (!t) return { value: null };
      var m = /^(\d{1,3}):([0-5]\d)$/.exec(t);
      if (m) return { value: parseInt(m[1], 10) * 60 + parseInt(m[2], 10) };
      if (/^\d+$/.test(t)) return { value: parseInt(t, 10) }; // bare seconds
      return { error: 'Enter time as m:ss, like 2:10.' };
    }

    function logSet() {
      if (saving) return;
      hide($('save-error'));
      var w = parseWeight($('weight-input').value);
      var r = parseReps($('reps-input').value);
      var t = parseTime($('time-input').value);
      if (w.error) return showSaveError(w.error);
      if (r.error) return showSaveError(r.error);
      if (t.error) return showSaveError(t.error);
      if (w.value == null && r.value == null && t.value == null) {
        return showSaveError('Enter at least one of weight, reps or time.');
      }
      saving = true;
      $('log-btn').disabled = true;
      api('POST', 'sets', {
        exercise_ref: selectedRef,
        weight_kg: w.value,
        reps: r.value,
        seconds: t.value,
      }).then(function (res) {
        saving = false;
        $('log-btn').disabled = false;
        if (!res.ok) {
          return showSaveError(res.data && res.data.error
            ? res.data.error
            : "Couldn't save the set. Try again.");
        }
        // The set goes to the top of History; the fields keep their values.
        sets.unshift(res.data.set);
        confirmDeleteId = null;
        renderAll();
      }, function () {
        saving = false;
        $('log-btn').disabled = false;
        showSaveError("Couldn't save the set. Try again.");
      });
    }

    function loadAll() {
      showLoading();
      Promise.all([api('GET', 'exercises'), api('GET', 'sets')]).then(function (rs) {
        if (!rs[0].ok || !rs[1].ok) return showError();
        if (rs[0].data && rs[0].data.stations && rs[0].data.stations.length) {
          stations = rs[0].data.stations;
        }
        sets = rs[1].data.sets || [];
        hide($('progress-loading'));
        hide($('history-loading'));
        renderAll();
        if (selectedRef) prefillFromLast(selectedRef);
      }, showError);
    }

    // ── Wiring ───────────────────────────────────────────────────────────
    $('exercise-select').addEventListener('change', function () {
      selectedRef = this.value;
      prefillFromLast(selectedRef);
      hide($('save-error'));
    });

    $('log-btn').addEventListener('click', logSet);

    $('chips').addEventListener('click', function (ev) {
      var t = ev.target.closest('.chip');
      if (!t) return;
      progressRef = t.getAttribute('data-ref');
      renderProgress();
    });

    $('history').addEventListener('click', function (ev) {
      var t = ev.target.closest('button');
      if (!t) return;
      if (t.classList.contains('ico')) {
        confirmDeleteId = t.getAttribute('data-id');
        renderHistory();
      } else if (t.classList.contains('del-no')) {
        confirmDeleteId = null;
        renderHistory();
      } else if (t.classList.contains('del-yes')) {
        var id = t.getAttribute('data-id');
        api('DELETE', 'sets/' + id).then(function (res) {
          if (!res.ok) {
            confirmDeleteId = null;
            renderHistory();
            return showSaveError("Couldn't delete the set. Try again.");
          }
          confirmDeleteId = null;
          sets = sets.filter(function (s) { return String(s.id) !== String(id); });
          renderAll();
        }, function () {
          confirmDeleteId = null;
          renderHistory();
          showSaveError("Couldn't delete the set. Try again.");
        });
      }
    });

    $('retry-btn').addEventListener('click', loadAll);

    if (DEMO) show($('demo-note'));
    renderExerciseSelect();
    loadAll();
  })();
  </script>
</body>
</html>
